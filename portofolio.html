<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Portofolio</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <div id="introLines"></div>

    <nav class="sidebar close">

        <div class="image-text">
          <span class="image">
            <img src="gambar/mufid_m.jpeg" alt="Logo" />

            <span class="name">Engineering Software</span>
            <span class="profession">Web developer</span>
          </div>
        </div>
        <i class='bx bx-chevron-right toggle'></i>
      </header>

      <div class="menu-bar">
        <div class="menu">
          <li class="search-box">
            <i class='bx bx-search icon'></i>
            <input type="text" placeholder="Search..." />
          </li>

          <ul class="menu-links">
            <li class="nav-link">
              <a href="home.html">
                <i class='bx bx-home-alt icon'></i>
                <span class="text nav-text">Home</span>
              </a>
            </li>
            <li class="nav-link">
              <a href="portofolio.html">
                <i class='bx bx-briefcase-alt icon'></i>

              </a>
            </li>
            <li class="nav-link">
              <a href="resume.html">

              </a>
            </li>
            <li class="nav-link">
              <a href="blog.html">
                <i class='bx bx-book icon'></i>
                <span class="text nav-text">Blog</span>
              </a>
            </li>
            <li class="nav-link">
              <a href="about.html">
                <i class='bx bx-user icon'></i>
                <span class="text nav-text">About Me</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="bottom-content">
          <li class="mode">
            <div class="sun-moon">
              <i class='bx bx-moon icon moon'></i>
              <i class='bx bx-sun icon sun'></i>
            </div>
            <span class="mode-text text">Dark mode</span>
            <div class="toggle-switch">
              <span class="switch"></span>
            </div>
          </li>
        </div>
      </div>
    </nav>

    <section class="home">
      <div class="hero-header">
        <div class="wrapper">
          <div class="container" style="justify-content:center;">
            <div class="hero-text" style="text-align:center;">
              <h1 style="margin-top: 20px;">Portofolio</h1>
              <p style="max-width: 600px; margin: 0 auto;">Halaman Portofolio masih kosong.</p>
            </div>
          </div>
        </div>
      </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.10/typed.min.js"></script>
